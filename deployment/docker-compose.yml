services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: mrbot-payroll:local
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    user: "${PAYROLL_UID:-1000}:${PAYROLL_GID:-1000}"
    environment:
      PAYROLL_APP_NAME: ${PAYROLL_APP_NAME:-Payroll Argentina}
      PAYROLL_ENVIRONMENT: ${PAYROLL_ENVIRONMENT:-development}
      PAYROLL_DEBUG: ${PAYROLL_DEBUG:-false}
      PAYROLL_SECRET_KEY: ${PAYROLL_SECRET_KEY:-}
      PAYROLL_DATABASE_URL: ${PAYROLL_DATABASE_URL:-sqlite:///./data/payroll.db}
      PAYROLL_WEB_DATA_SOURCE: ${PAYROLL_WEB_DATA_SOURCE:-demo}
      PAYROLL_SEED_DEMO: ${PAYROLL_SEED_DEMO:-false}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payroll}
      POSTGRES_USER: ${POSTGRES_USER:-payroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
